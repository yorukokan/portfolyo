<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 920" width="1520" height="920">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19120E"/>
      <stop offset="45%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#12101E"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="18%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181C28" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#10131C" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="1520" height="920" fill="url(#bgGrad)"/>
  <rect width="1520" height="920" fill="url(#amberGlow)"/>
  <rect width="1520" height="920" fill="url(#blueGlow)"/>

  <!-- Üst Rozet -->
  <rect x="64" y="68" width="380" height="54" rx="27" fill="#1F1914" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="254" y="102" text-anchor="middle" fill="#FBBF24" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="3.5">BOOKAN · MOBİL &amp; WEB</text>

  <!-- Ana Başlık (Sol) -->
  <text x="64" y="218" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">Okuma kültürünü sosyal</text>
  <text x="64" y="302" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5">keşif ağına dönüştür.</text>

  <!-- Alt Açıklama -->
  <text x="64" y="378" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="25" font-weight="400">Kişisel kütüphane raflarını, sayfa referanslı alıntı akışını ve Google Books API</text>
  <text x="64" y="418" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="25" font-weight="400">kataloğunu Flutter (Cloud Firestore) ve PHP 8 (MySQL) üzerinde birleştirir.</text>

  <!-- Sağ Mimari Diyagram Kutusu -->
  <rect x="980" y="68" width="476" height="410" rx="24" fill="#131722" stroke="#334155" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="1016" y="114" fill="#FBBF24" font-family="Space Grotesk, monospace" font-size="17" font-weight="600" letter-spacing="2">ÇİFT PLATFORMLU MİMARİ</text>

  <!-- Mobil Katman -->
  <rect x="1016" y="138" width="194" height="132" rx="16" fill="#1A2232" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="1038" y="174" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700">Bookan Mobile</text>
  <text x="1038" y="204" fill="#CBD5E1" font-family="Plus Jakarta Sans, sans-serif" font-size="15">· Flutter &amp; Dart</text>
  <text x="1038" y="228" fill="#CBD5E1" font-family="Plus Jakarta Sans, sans-serif" font-size="15">· Cloud Firestore</text>
  <text x="1038" y="252" fill="#CBD5E1" font-family="Plus Jakarta Sans, sans-serif" font-size="15">· Firebase Auth</text>

  <!-- Web Katman -->
  <rect x="1226" y="138" width="194" height="132" rx="16" fill="#1A2232" stroke="#A78BFA" stroke-opacity="0.4" stroke-width="1.2"/>
  <text x="1248" y="174" fill="#A78BFA" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700">Bookan Web</text>
  <text x="1248" y="204" fill="#CBD5E1" font-family="Plus Jakarta Sans, sans-serif" font-size="15">· Native PHP 8 (PDO)</text>
  <text x="1248" y="228" fill="#CBD5E1" font-family="Plus Jakarta Sans, sans-serif" font-size="15">· MySQL İlişkisel Şema</text>
  <text x="1248" y="252" fill="#CBD5E1" font-family="Plus Jakarta Sans, sans-serif" font-size="15">· Bcrypt &amp; XSS Koruma</text>

  <!-- Ortak Servis & Veritabanı -->
  <rect x="1016" y="292" width="404" height="154" rx="16" fill="#171C29" stroke="#F59E0B" stroke-opacity="0.38" stroke-width="1.2"/>
  <text x="1040" y="330" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="19" font-weight="600">Google Books API &amp; Alıntı Motoru</text>
  <text x="1040" y="362" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="15">ISBN / Yazar / Kategori Sorgulama · Okuma Durumu Rafları</text>
  <rect x="1040" y="384" width="108" height="36" rx="8" fill="#263147"/>
  <text x="1094" y="407" text-anchor="middle" fill="#38BDF8" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">OKUNUYOR</text>
  <rect x="1160" y="384" width="108" height="36" rx="8" fill="#263147"/>
  <text x="1214" y="407" text-anchor="middle" fill="#34D399" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">OKUNDU</text>
  <rect x="1280" y="384" width="116" height="36" rx="8" fill="#263147"/>
  <text x="1338" y="407" text-anchor="middle" fill="#FBBF24" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="600">ALINTILAR</text>

  <!-- Alt 3 Modül Kartı (01, 02, 03) -->
  <!-- Kart 01 -->
  <rect x="64" y="544" width="436" height="308" rx="26" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="106" y="632" fill="#FBBF24" font-family="Plus Jakarta Sans, sans-serif" font-size="52" font-weight="700">01</text>
  <text x="106" y="696" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="29" font-weight="700">Google Books Keşfi</text>
  <text x="106" y="744" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">Milyonlarca kitabın ISBN, kapak, özet ve</text>
  <text x="106" y="778" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">yazar verilerine anında erişim.</text>

  <!-- Kart 02 -->
  <rect x="542" y="544" width="436" height="308" rx="26" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="584" y="632" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="52" font-weight="700">02</text>
  <text x="584" y="696" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="29" font-weight="700">Sosyal Alıntı Akışı</text>
  <text x="584" y="744" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">Kitap ve sayfa numarası referanslı</text>
  <text x="584" y="778" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">alıntı paylaşımı, beğeni ve yorumlar.</text>

  <!-- Kart 03 -->
  <rect x="1020" y="544" width="436" height="308" rx="26" fill="url(#cardGrad)" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="1062" y="632" fill="#A78BFA" font-family="Plus Jakarta Sans, sans-serif" font-size="52" font-weight="700">03</text>
  <text x="1062" y="696" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="29" font-weight="700">Kişisel Kütüphane</text>
  <text x="1062" y="744" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">Okunacak, okunuyor ve bitti listeleriyle</text>
  <text x="1062" y="778" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">gerçek zamanlı okuma takibi.</text>
</svg>
