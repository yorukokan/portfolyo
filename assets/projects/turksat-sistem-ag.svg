<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 920" width="1520" height="920">
  <defs>
    <linearGradient id="bgGradTrk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07191E"/>
      <stop offset="48%" stop-color="#0B101B"/>
      <stop offset="100%" stop-color="#130F21"/>
    </linearGradient>
    <radialGradient id="tealGlow" cx="18%" cy="16%" r="55%">
      <stop offset="0%" stop-color="#2DD4BF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="indigoGlow" cx="85%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGradTrk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#151B28" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0E121B" stop-opacity="0.92"/>
    </linearGradient>
  </defs>

  <!-- Arka Plan -->
  <rect width="1520" height="920" fill="url(#bgGradTrk)"/>
  <rect width="1520" height="920" fill="url(#tealGlow)"/>
  <rect width="1520" height="920" fill="url(#indigoGlow)"/>

  <!-- Üst Rozet -->
  <rect x="64" y="68" width="440" height="54" rx="27" fill="#0B2228" stroke="#2DD4BF" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="284" y="102" text-anchor="middle" fill="#5EEAD4" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="20" font-weight="600" letter-spacing="3.2">TÜRKSAT A.Ş. · SİSTEM VE AĞ</text>

  <!-- Ana Başlık -->
  <text x="64" y="218" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5">Kurumsal etki alanı, ağ</text>
  <text x="64" y="302" fill="#F8FAFC" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="66" font-weight="700" letter-spacing="-1.5">güvenliği ve otomasyon.</text>

  <!-- Alt Açıklama -->
  <text x="64" y="378" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="25" font-weight="400">Active Directory (AD DS), DNS, DHCP ve GPO mimarilerinin yönetimi, En Az Yetki</text>
  <text x="64" y="418" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="25" font-weight="400">Prensibi (PoLP) kapsamında RBAC denetimi ve Linux/Windows sunucu otomasyonu.</text>

  <!-- Sağ Kurumsal Topoloji Diyagramı -->
  <rect x="980" y="68" width="476" height="410" rx="24" fill="#111622" stroke="#334155" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="1016" y="114" fill="#5EEAD4" font-family="Space Grotesk, monospace" font-size="17" font-weight="600" letter-spacing="2">KURUMSAL ALTYAPI TOPOLOJİSİ</text>

  <rect x="1016" y="138" width="404" height="84" rx="14" fill="#172233" stroke="#2DD4BF" stroke-opacity="0.42" stroke-width="1.2"/>
  <text x="1040" y="172" fill="#5EEAD4" font-family="Plus Jakarta Sans, sans-serif" font-size="18" font-weight="700">Active Directory Domain Services (AD DS)</text>
  <text x="1040" y="200" fill="#CBD5E1" font-family="Plus Jakarta Sans, sans-serif" font-size="14.5">Domain Controller Yedekliliği · OU Hiyerarşisi · Merkezi GPO</text>

  <rect x="1016" y="238" width="194" height="96" rx="14" fill="#161F2E" stroke="#38BDF8" stroke-opacity="0.38" stroke-width="1.2"/>
  <text x="1036" y="270" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="16.5" font-weight="700">DNS &amp; DHCP</text>
  <text x="1036" y="296" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5">İsim Çözümleme &amp; IP</text>
  <text x="1036" y="316" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5">Havuzu Sürekliliği</text>

  <rect x="1226" y="238" width="194" height="96" rx="14" fill="#161F2E" stroke="#A78BFA" stroke-opacity="0.38" stroke-width="1.2"/>
  <text x="1246" y="270" fill="#A78BFA" font-family="Plus Jakarta Sans, sans-serif" font-size="16.5" font-weight="700">PoLP &amp; RBAC</text>
  <text x="1246" y="296" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5">Delegation of Control</text>
  <text x="1246" y="316" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="13.5">&amp; Yetki Denetimi</text>

  <rect x="1016" y="350" width="404" height="98" rx="14" fill="#151C28" stroke="#60A5FA" stroke-opacity="0.38" stroke-width="1.2"/>
  <text x="1040" y="384" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="17" font-weight="600">Linux &amp; Windows Server Otomasyonu</text>
  <text x="1040" y="412" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="14.5">PowerShell · Bash Scripting · Wireshark &amp; TCP/IP Analizi</text>

  <!-- Alt 3 Modül Kartı (01, 02, 03) -->
  <rect x="64" y="544" width="436" height="308" rx="26" fill="url(#cardGradTrk)" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="106" y="632" fill="#2DD4BF" font-family="Plus Jakarta Sans, sans-serif" font-size="52" font-weight="700">01</text>
  <text x="106" y="696" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="29" font-weight="700">AD DS &amp; GPO Mimarisi</text>
  <text x="106" y="744" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">Etki alanı servisleri, DNS/DHCP yönetimi</text>
  <text x="106" y="778" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">ve merkezi grup ilkeleri yapılandırması.</text>

  <rect x="542" y="544" width="436" height="308" rx="26" fill="url(#cardGradTrk)" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="584" y="632" fill="#38BDF8" font-family="Plus Jakarta Sans, sans-serif" font-size="52" font-weight="700">02</text>
  <text x="584" y="696" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="29" font-weight="700">En Az Yetki (PoLP)</text>
  <text x="584" y="744" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">Rol tabanlı erişim kontrolü (RBAC), yetki</text>
  <text x="584" y="778" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">devri ve kurumsal güvenlik denetimi.</text>

  <rect x="1020" y="544" width="436" height="308" rx="26" fill="url(#cardGradTrk)" stroke="#334155" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="1062" y="632" fill="#A78BFA" font-family="Plus Jakarta Sans, sans-serif" font-size="52" font-weight="700">03</text>
  <text x="1062" y="696" fill="#F8FAFC" font-family="Plus Jakarta Sans, sans-serif" font-size="29" font-weight="700">Sistem Otomasyonu</text>
  <text x="1062" y="744" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">PowerShell ve Bash scriptleriyle sunucu</text>
  <text x="1062" y="778" fill="#94A3B8" font-family="Plus Jakarta Sans, sans-serif" font-size="22">operasyonları ve ağ trafiği izleme.</text>
</svg>
